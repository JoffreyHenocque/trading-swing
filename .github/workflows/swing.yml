name: swing-paper

on:
  schedule:
    - cron: "45 16 * * 1-5"   # weekdays 17:45 Paris in winter (18:45 in summer), after the 17:30 close
    - cron: "0 7 * * 0"       # Sunday morning: backtests
  workflow_dispatch:
    inputs:
      task:
        description: "run, backtest or all"
        default: "run"

permissions:
  contents: write

concurrency:
  group: swing
  cancel-in-progress: false

jobs:
  swing:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DAILY: ${{ github.event.schedule == '45 16 * * 1-5' || (github.event_name == 'workflow_dispatch' && inputs.task != 'backtest') }}
      WEEKLY: ${{ github.event.schedule == '0 7 * * 0' || (github.event_name == 'workflow_dispatch' && inputs.task != 'run') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Swing paper account
        if: env.DAILY == 'true'
        run: python3 swing/swing.py run
      - name: Swing backtest (v1)
        if: env.WEEKLY == 'true'
        run: python3 swing/swing.py backtest --years 3
      - name: Lab v2 backtest
        if: env.WEEKLY == 'true'
        run: python3 swing/lab.py backtest
        continue-on-error: true
      - name: Lab v2 signals
        if: env.DAILY == 'true' || env.WEEKLY == 'true'
        run: python3 swing/lab.py signals
        continue-on-error: true
      - name: News digest
        if: env.DAILY == 'true'
        run: python3 swing/news.py
        continue-on-error: true
      - name: Save results
        run: |
          git config user.name "swing-bot"
          git config user.email "swing-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "swing: $(date -u +%F) ${{ github.event_name }}"
          git pull --rebase --autostash || true
          git push
